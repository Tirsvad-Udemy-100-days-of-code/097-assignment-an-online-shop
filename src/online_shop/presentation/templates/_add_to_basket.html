{% macro add_to_basket(product_id, site) -%}
<form class="add-form" method="post" action="{{ url_for('basket.add') }}">{% include "_csrf.html" %}<input type="hidden" name="product_id" value="{{ product_id }}"><input type="hidden" name="next" value="{{ request.path }}"><button class="button" type="submit">{{ site.basket.add }}</button></form>
{%- endmacro %}
